apiVersion: v1
kind: Namespace
metadata:
  name: nimtable
---
apiVersion: v1
kind: Secret
metadata:
  name: nimtable-admin-secret
  namespace: nimtable
type: Opaque
stringData:
  ADMIN_USERNAME: "admin"   # Initial admin username (change as needed)
  ADMIN_PASSWORD: "admin"   # Initial admin password (change after first login)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nimtable-config
  namespace: nimtable
data:
  config.yaml: |
    # Minimal app config; UI listens on 3000, backend service on 8182
    server:
      port: 8182
      host: 0.0.0.0
    database:
      # Point to the in-cluster PostgreSQL Service
      url: jdbc:postgresql://nimtable-postgres:5432/nimtable_db
      username: nimtable_user
      password: nimtable_password
---
apiVersion: v1
kind: Service
metadata:
  name: nimtable-postgres
  namespace: nimtable
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app: nimtable-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: nimtable-postgres-hl
  namespace: nimtable
spec:
  # Headless service for the StatefulSet
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app: nimtable-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nimtable-postgres
  namespace: nimtable
spec:
  serviceName: nimtable-postgres-hl
  replicas: 1
  selector:
    matchLabels:
      app: nimtable-postgres
  template:
    metadata:
      labels:
        app: nimtable-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: nimtable_db
            - name: POSTGRES_USER
              value: nimtable_user
            - name: POSTGRES_PASSWORD
              value: nimtable_password
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimtable
  namespace: nimtable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nimtable
  template:
    metadata:
      labels:
        app: nimtable
    spec:
      containers:
        - name: nimtable
          image: nimtable/nimtable:latest  # Replace with your actual image if different
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 3000   # Web UI
            - name: api
              containerPort: 8182   # Backend service port
          envFrom:
            - secretRef:
                name: nimtable-admin-secret   # Initial admin credentials (effective on first run)
          volumeMounts:
            - name: nimtable-config
              mountPath: /app/config.yaml     # App expects config at this path
              subPath: config.yaml
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: nimtable-config
          configMap:
            name: nimtable-config
---
apiVersion: v1
kind: Service
metadata:
  name: nimtable
  namespace: nimtable
spec:
  selector:
    app: nimtable
  ports:
    - name: http
      port: 3000            # Service port
      targetPort: 3000      # Pod containerPort
      nodePort: 30080       # NodePort (30000–32767 by default)
  type: NodePort
