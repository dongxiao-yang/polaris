apiVersion: v1
kind: Namespace
metadata:
  name: nimtable
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nimtable-config
  namespace: nimtable
data:
  # Backend reads this file at /nimtable/config.yaml
  config.yaml: |
    server:
      host: 0.0.0.0
      port: 8182
    database:
      # JDBC points to the in-cluster PostgreSQL Service
      url: jdbc:postgresql://nimtable-postgres:5432/nimtable
      username: nimtable_user
      password: nimtable_password
---
apiVersion: v1
kind: Service
metadata:
  name: nimtable-postgres
  namespace: nimtable
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app: nimtable-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: nimtable-postgres-hl
  namespace: nimtable
spec:
  # Headless service for stable DNS of the StatefulSet
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app: nimtable-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nimtable-postgres
  namespace: nimtable
spec:
  serviceName: nimtable-postgres-hl
  replicas: 1
  selector:
    matchLabels:
      app: nimtable-postgres
  template:
    metadata:
      labels:
        app: nimtable-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            # Same style as docker-compose
            - name: POSTGRES_DB
              value: nimtable
            - name: POSTGRES_USER
              value: nimtable_user
            - name: POSTGRES_PASSWORD
              value: nimtable_password
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimtable-backend
  namespace: nimtable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nimtable-backend
  template:
    metadata:
      labels:
        app: nimtable-backend
    spec:
      containers:
        - name: nimtable
          image: ghcr.io/nimtable/nimtable:nightly   # Backend API
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 8182
          volumeMounts:
            - name: nimtable-config
              mountPath: /nimtable/config.yaml       # Backend expects this path
              subPath: config.yaml
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: nimtable-config
          configMap:
            name: nimtable-config
---
apiVersion: v1
kind: Service
metadata:
  name: nimtable-backend
  namespace: nimtable
spec:
  selector:
    app: nimtable-backend
  ports:
    - name: http
      port: 8182            # Cluster-internal API port
      targetPort: 8182
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimtable-web
  namespace: nimtable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nimtable-web
  template:
    metadata:
      labels:
        app: nimtable-web
    spec:
      containers:
        - name: nimtable-web
          image: ghcr.io/nimtable/nimtable-web:nightly   # Next.js frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 3000
          env:
            # Frontend -> Backend API endpoint (in-cluster)
            - name: JAVA_API_URL
              value: "http://nimtable-backend:8182"

            # Frontend DB for auth/session (same Postgres)
            - name: DATABASE_URL
              value: "postgresql://nimtable_user:nimtable_password@nimtable-postgres:5432/nimtable"

            # Initial admin credentials (compose-style, plain env)
            - name: ADMIN_USERNAME
              value: "admin"
            - name: ADMIN_PASSWORD
              value: "admin"

            # Auth/JWT secret(s) as plain env (compose-style)
            # If the app uses NextAuth v4: NEXTAUTH_SECRET; v5: AUTH_SECRET; some builds use JWT_SECRET
            - name: NEXTAUTH_SECRET
              value: "please-change-me-nextauth-secret"
            - name: AUTH_SECRET
              value: "please-change-me-auth-secret"
            - name: JWT_SECRET
              value: "please-change-me-jwt-secret"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nimtable-web
  namespace: nimtable
spec:
  selector:
    app: nimtable-web
  ports:
    - name: http
      port: 3000            # Cluster-internal service port
      targetPort: 3000
      nodePort: 30080       # Exposed NodePort (default range 30000–32767)
  type: NodePort
